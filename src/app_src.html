<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: mediastream:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Quick-check</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#1a2027; --sub:#5b6670; --line:#d8dee4;
  --add:#0b7a3b; --add-bg:#e7f6ed; --add-line:#8fd2ae;
  --del:#b3261e; --del-bg:#fdecea; --del-line:#f0a9a4;
  --chg:#a25a00; --chg-bg:#fff4e2; --chg-line:#f0c383;
  --same:#5b6670; --same-bg:#f2f4f6; --same-line:#dce1e6;
  --info:#0b5cad; --info-bg:#e8f1fb; --info-line:#a6c8ec;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 80px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.02em}
h2{font-size:16px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
h3{font-size:14px;margin:18px 0 8px;color:var(--sub)}
.sub{color:var(--sub);font-size:12.5px;margin:0}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.privacy{
  font-size:12px;color:var(--info);background:var(--info-bg);border:1px solid var(--info-line);
  border-radius:6px;padding:6px 10px;display:inline-block
}
button{
  font:inherit;font-size:14px;cursor:pointer;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink);padding:8px 14px;transition:background .12s,border-color .12s
}
button:hover:not(:disabled){background:#eef1f4;border-color:#b9c2ca}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#1c5fa8;border-color:#1c5fa8;color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#164e8b;border-color:#164e8b}
button.ghost{background:transparent;border-color:transparent;color:var(--sub);padding:6px 8px;font-size:12.5px;text-decoration:underline}
button.ghost:hover:not(:disabled){background:#e9edf1}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:820px){.panes{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px}
.pane.prev{border-top:4px solid #8b93a1}
.pane.curr{border-top:4px solid #1c5fa8}
.pane-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.pane-title{font-size:15px;font-weight:700;margin:0}
.pane-state{font-size:12px;color:var(--sub)}
.slots{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap;align-items:center}
.slots .slots-label{font-size:11.5px;color:var(--sub);margin-right:2px}
.slot{
  display:flex;align-items:center;justify-content:center;
  width:30px;height:24px;border-radius:6px;
  background:#dfe4e9;color:var(--sub);font-size:12.5px;font-weight:700;
  border:1px solid transparent
}
.slot.on{background:#1c5fa8;color:#fff}
.slot.next{border-color:#1c5fa8;color:#1c5fa8;background:#eaf2fb}
.summary-lines{font-size:13px;margin:8px 0 0}
.summary-lines div{display:flex;gap:8px;padding:2px 0;border-bottom:1px dotted #e6eaee}
.summary-lines .k{color:var(--sub);min-width:6.5em;flex:none}
.summary-lines .v{font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.drop{
  margin-top:10px;border:1.5px dashed #c3cbd3;border-radius:8px;padding:10px;text-align:center;
  color:var(--sub);font-size:12px;background:#fafbfc
}
.drop.over{border-color:#1c5fa8;background:#eaf2fb;color:var(--info)}
.msg{font-size:12.5px;margin-top:8px;padding:7px 10px;border-radius:6px;display:none}
.msg.show{display:block}
.msg.ok{background:var(--add-bg);color:var(--add);border:1px solid var(--add-line)}
.msg.err{background:var(--del-bg);color:var(--del);border:1px solid var(--del-line)}
.msg.warn{background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.alert{border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:13.5px;border:1px solid}
.alert.danger{background:var(--del-bg);border-color:var(--del-line);color:var(--del);font-weight:700}
.alert.warn{background:var(--chg-bg);border-color:var(--chg-line);color:var(--chg)}
.alert.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.counts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.count{border-radius:8px;padding:8px 14px;min-width:96px;border:1px solid}
.count .n{font-size:23px;font-weight:700;line-height:1.15}
.count .l{font-size:11.5px;letter-spacing:.04em}
.count.add{background:var(--add-bg);border-color:var(--add-line);color:var(--add)}
.count.del{background:var(--del-bg);border-color:var(--del-line);color:var(--del)}
.count.chg{background:var(--chg-bg);border-color:var(--chg-line);color:var(--chg)}
.count.same{background:var(--same-bg);border-color:var(--same-line);color:var(--same)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
th{background:#eef1f4;font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
tr.r-add td{background:var(--add-bg)}
tr.r-del td{background:var(--del-bg)}
tr.r-chg td{background:var(--chg-bg)}
tr.r-same td{background:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap}
.tag.add{background:var(--add);color:#fff}
.tag.del{background:var(--del);color:#fff}
.tag.chg{background:var(--chg);color:#fff}
.tag.same{background:#98a2ac;color:#fff}
.tag.note{background:#fff;color:var(--chg);border:1px solid var(--chg-line);font-weight:600}
.dname{font-weight:600}
.strike{text-decoration:line-through;color:var(--del)}
.meta{color:var(--sub);font-size:11.5px}
.chg-list{margin:0;padding-left:0;list-style:none}
.chg-list li{padding:1px 0}
.chg-list .k{font-weight:700;font-size:11.5px;background:#fff;border:1px solid var(--chg-line);border-radius:4px;padding:0 5px;margin-right:5px;color:var(--chg)}
.arrow{color:var(--sub);padding:0 4px}
.rx-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.rx-cols{grid-template-columns:1fr}}
.rp{border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden}
.rp-head{background:#eef1f4;padding:5px 10px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.rp-body{padding:8px 10px}
.rp-drug{padding:3px 0;border-bottom:1px dotted #e6eaee;font-size:13px}
.rp-drug:last-child{border-bottom:none}
.rp-use{font-size:12.5px;color:var(--info);margin-top:5px;padding-top:5px;border-top:1px solid #e6eaee}
details{margin-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--sub);padding:5px 0}
pre{background:#f7f9fa;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11.5px;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-all}
dialog{border:none;border-radius:12px;padding:0;max-width:min(94vw,720px);width:100%;box-shadow:0 18px 50px rgba(0,0,0,.32)}
dialog::backdrop{background:rgba(10,16,22,.62)}
.dlg{padding:16px 18px 18px}
.dlg h2{border:none;margin-bottom:6px;padding:0}
#video{width:100%;border-radius:8px;background:#000;display:block;aspect-ratio:4/3;object-fit:cover}
.scanbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
#scanState{font-size:13.5px;font-weight:600}
textarea{width:100%;min-height:220px;font-family:Consolas,"Courier New",monospace;font-size:12px;padding:9px;border:1px solid var(--line);border-radius:7px;resize:vertical}
.hidden{display:none!important}
/* 読取フィードバックの画面フラッシュ（マナーモードでも視認できる） */
.flash{position:fixed;inset:0;pointer-events:none;z-index:2147483647;opacity:0}
.flash.part{background:#1c5fa8}
.flash.ok{background:#0b7a3b}
.flash.dup{background:#98a2ac}
.flash.err{background:#b3261e}
.flash.go{animation:flashfade .4s ease-out}
.flash.go.ok{animation-duration:.7s}
@keyframes flashfade{from{opacity:.8}to{opacity:0}}
.footnote{font-size:11.5px;color:var(--sub);margin-top:8px}
.footnote code{background:#eef1f4;padding:0 4px;border-radius:3px}
.storebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.storebar .btnrow{margin-top:0}
#storeInfo{font-size:12.5px;color:var(--sub)}
#storeInfo b{color:var(--ink)}
.src{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--info-bg);color:var(--info);border:1px solid var(--info-line)}

/* タッチ端末（スマホ・タブレット）— 指で確実に押せる大きさにする */
@media (pointer:coarse){
  body{font-size:16px}
  .wrap{padding:16px 14px 60px}
  button{padding:13px 18px;font-size:15px;min-height:48px}
  button.ghost{min-height:44px;font-size:14px}
  .btnrow{gap:10px}
  .pane{padding:16px 14px 18px}
  .drop{padding:14px;font-size:13px}
  .slot{width:42px;height:32px;font-size:15px}
  .msg{font-size:14px;padding:10px 12px}
  table{font-size:14px}
  th,td{padding:9px 8px}
  .meta{font-size:13px}
  dialog{max-width:100vw}
  .dlg{padding:14px 14px 18px}
  #video{aspect-ratio:3/4}
  summary{padding:10px 0}
}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .card{border:none;padding:0;margin-bottom:14px;break-inside:avoid}
  .pane{break-inside:avoid}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>Quick-check</h1>
  </div>
  <div class="noprint" style="text-align:right">
    <span class="privacy">90日で自動削除されます。</span>
    <div class="btnrow" style="justify-content:flex-end">
      <button onclick="window.print()">結果を印刷</button>
      <button onclick="loadDemo()">デモデータ</button>
      <button onclick="clearAll()">画面をクリア</button>
    </div>
  </div>
</header>

<div class="panes noprint" style="grid-template-columns:1fr">
  <section class="pane curr" id="pane-scan">
    <div class="pane-head">
      <p class="pane-title">処方せんを読む</p>
      <span class="pane-state">同じ患者・医療機関・診療科の前回処方があれば自動で比較します</span>
    </div>
    <div class="slots" id="slots-scan"></div>
    <div class="btnrow">
      <button class="primary" onclick="openCamera('scan')">カメラで読取</button>
      <button onclick="pickImage('scan')">画像から読取</button>
      <button class="ghost" onclick="openText()">テキスト入力</button>
    </div>
    <div class="drop" id="drop-scan">画像ファイルをここにドロップ／Ctrl+V で貼り付け</div>
    <div class="msg" id="msg-scan"></div>
  </section>
</div>

<div class="card noprint">
  <div class="storebar">
    <span id="storeInfo">保存領域を確認しています…</span>
    <span class="btnrow">
      <button class="ghost" onclick="exportData()">書き出し</button>
      <button class="ghost" onclick="importData()">読み込み</button>
      <button class="ghost" onclick="clearStore()">保存を全消去</button>
    </span>
  </div>
</div>

<div id="result"></div>

<input type="file" id="filepick" accept="image/*" class="hidden">
<input type="file" id="jsonpick" accept="application/json,.json" class="hidden">
<canvas id="cv" class="hidden"></canvas>

<dialog id="camDlg">
  <div class="dlg">
    <h2 id="camTitle">カメラで読取</h2>
    <p class="sub">処方せんのQRコードを枠いっぱいに写してください。分割QRは全て読み取るまで続けてかざします。</p>
    <video id="video" playsinline muted></video>
    <div class="scanbar">
      <span id="scanState">カメラを起動しています…</span>
      <span>
        <button onclick="Sound.unlock();beep('part')">音の確認</button>
        <button onclick="closeCamera()">閉じる</button>
      </span>
    </div>
    <div class="slots" id="slots-cam"></div>
    <div class="msg" id="msg-cam"></div>
  </div>
</dialog>

<dialog id="bakDlg">
  <div class="dlg">
    <h2 id="bakTitle">保存データ</h2>
    <p class="sub" id="bakHint"></p>
    <textarea id="bakArea" spellcheck="false"></textarea>
    <div class="scanbar">
      <span class="meta" id="bakMsg"></span>
      <span>
        <button id="bakCopyBtn" class="primary" onclick="bakCopy()">コピー</button>
        <button onclick="document.getElementById('jsonpick').click()">ファイルから</button>
        <button id="bakImportBtn" class="primary" onclick="bakImport()">取り込む</button>
        <button onclick="document.getElementById('bakDlg').close()">閉じる</button>
      </span>
    </div>
  </div>
</dialog>

<dialog id="txtDlg">
  <div class="dlg">
    <h2 id="txtTitle">テキスト入力</h2>
    <p class="sub">QRをデコード済みのJAHIS形式テキスト（1行目が <code>JAHIS10</code> 等）を貼り付けます。動作確認や他システム連携用です。</p>
    <textarea id="txtArea" spellcheck="false"></textarea>
    <div class="scanbar">
      <span class="meta" id="txtMsg"></span>
      <span>
        <button class="primary" onclick="applyText()">読み込む</button>
        <button onclick="document.getElementById('txtDlg').close()">閉じる</button>
      </span>
    </div>
  </div>
</dialog>

</div>

<script id="jsqr-lib">/*__JSQR__*/</script>
<script id="drug-master">/*__MASTER__*/
var DRUG_MASTER_INFO=/*__MANIFEST__*/null;</script>
<script>
"use strict";

/* ============================================================
   1. JAHIS 院外処方箋2次元シンボル記録条件規約 Ver.1.10 のレコード定義
   ------------------------------------------------------------
   ・文字コード: Shift-JIS / 区切り: 半角カンマ / レコード終端: CRLF
   ・引用符で囲まない。区切り以外に半角カンマは出現しない。
   ・先頭行はバージョン情報 ("JAHIS10" 等、カンマ無し)
   ============================================================ */
const REC = {
  1:  {name:'医療機関',        f:['医療機関コード種別','医療機関コード','都道府県コード','医療機関名称']},

  21: {name:'保険種別',        f:['保険種別']},

const CODE = {
  剤形区分:  {'1':'内服','2':'頓服','3':'外用','4':'内服滴剤','5':'注射','6':'医療材料','9':'不明'},

  残薬確認:  {'1':'疑義照会した上で調剤','2':'保険医療機関へ情報提供'},
};
/* 年号区分コード（JAHIS別表2）。b=元年の西暦、from/to=その元号の実期間（YYYYMMDD）。
   from/to は交付日の厳格検証（strictDateKey）で使う。元号の切り替わりは年の途中の
   ため、変換後の西暦年月日が期間内かまで見ないと「昭和64年1月8日」「平成31年5月1日」
   のような存在しない日付を受理してしまう（第3回監査指摘3）。 */
const ERA = {
  '1':{n:'明治',b:1868, from:'18680123', to:'19120729'},
  '2':{n:'大正',b:1912, from:'19120730', to:'19261224'},
  '3':{n:'昭和',b:1926, from:'19261225', to:'19890107'},
  '4':{n:'平成',b:1989, from:'19890108', to:'20190430'},
  '5':{n:'令和',b:2019, from:'20190501', to:'99991231'},
};

/* ---------- 日付（西暦8/6/4桁・和暦7/5/3桁） ---------- */
function parseJDate(v){
  v=(v||'').trim();
  if(!/^\d{3,8}$/.test(v)) return null;
  let g=null,y,m=null,d=null;
  const L=v.length;
  if(L===8){y=+v.slice(0,4);m=+v.slice(4,6);d=+v.slice(6,8);}
  else if(L===6){y=+v.slice(0,4);m=+v.slice(4,6);}
  else if(L===4){y=+v;}
  else if(L===7){g=v[0];y=+v.slice(1,3);m=+v.slice(3,5);d=+v.slice(5,7);}
  else if(L===5){g=v[0];y=+v.slice(1,3);m=+v.slice(3,5);}
  else if(L===3){g=v[0];y=+v.slice(1,3);}
  else return null;
  let wa=null;
  if(g){ const e=ERA[g]; if(!e) return null; wa=e.n+y+'年'; y=e.b+y-1; }
  const key = String(y).padStart(4,'0')+(m?String(m).padStart(2,'0'):'00')+(d?String(d).padStart(2,'0'):'00');
  let text = y+'年'+(m?m+'月':'')+(d?d+'日':'');
  if(wa) text += '（'+wa+(m?m+'月':'')+(d?d+'日':'')+'）';
  return {y,m,d,key,text};
}

/* ---------- 文字列正規化（全半角・カナ・空白の揺れを吸収） ---------- */
function norm(s){
  if(s==null) return '';
  let t=String(s);
  try{ t=t.normalize('NFKC'); }catch(e){}
  return t.replace(/[\s　]+/g,'').toUpperCase();
}
// 規格（含量）を落とした基準名。ノルバスク錠2.5mg / ノルバスク錠5mg → 同一基準名
function baseName(s){
  return norm(s).replace(/^【般】|^\[般\]/,'').replace(/[0-9．.]/g,'');
}
function numOf(v){ const n=parseFloat(String(v==null?'':v).replace(/[^\d.\-]/g,'')); return isNaN(n)?null:n; }
function numEq(a,b){
  const x=numOf(a),y=numOf(b);
  if(x===null||y===null) return String(a||'')===String(b||'');
  return Math.abs(x-y) < 1e-9;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   1.5 医薬品コード表（支払基金マスタ同梱データ）
   ------------------------------------------------------------
   医療機関はQR容量節約のため薬品名称を省略してよい（レセ電算コードの場合）。
   その場合にコードから名称を補完する。
   ============================================================ */
const DrugDict=(function(){
  let r9=null, yj=null, gen=null;
  function build(){
    r9=new Map(); yj=new Map(); gen=new Map();
    if(typeof DRUG_MASTER_RAW==='undefined' || !DRUG_MASTER_RAW) return;
    for(const line of DRUG_MASTER_RAW.split('\n')){
      if(line[0]==='@'){                       // 一般名コード表
        const t=line.indexOf('\t');
        gen.set(line.slice(1,t), line.slice(t+1));
        continue;
      }
      const a=line.indexOf('\t'), b=line.indexOf('\t',a+1);
      const code9=line.slice(0,a), yjc=line.slice(a+1,b), name=line.slice(b+1);
      r9.set(code9, name);
      if(yjc && !yj.has(yjc)) yj.set(yjc, name);
    }
  }
  /** コード種別とコードから名称を引く。見つからなければ null */
  function lookup(kind, code){
    if(!code) return null;
    if(!r9) build();
    if(kind==='2') return r9.get(code)||null;
    if(kind==='3'||kind==='4') return yj.get(code)||null;
    if(kind==='7') return gen.get(code)||null;
    return null;
  }
  return {lookup, get loaded(){ if(!r9) build(); return r9.size>0; }};
})();

/* ============================================================
   2. パーサ： JAHIS CSV → 構造化された処方せん
   ============================================================ */
function parseJahis(text){
  const raw = String(text).replace(/\x1a[\s\S]*$/,'');           // EOF(1Ah)以降を切り捨て
  const lines = raw.split(/\r\n|\r|\n/).filter(l=>l.trim()!=='');
  const rx = {version:null, records:[], rps:[], raw:raw, errors:[]};
  const rpMap = new Map();
  const getRp = no => {
    if(!rpMap.has(no)){
      const rp={no, 剤形区分:'', 剤形名称:'', 調剤数量:'', 用法:null, 用法補足:[], drugs:[], 分割:null};
      rpMap.set(no, rp); rx.rps.push(rp);
    }
    return rpMap.get(no);
  };
  const getDrug = (rpNo, seq) => {
    const rp=getRp(rpNo);
    let d=rp.drugs.find(x=>x.seq===seq);
    if(!d){ d={seq, rp, 情報区分:'', コード種別:'', コード:'', 名称:'', 用量:'', 力価フラグ:'', 単位:'',
              単位変換係数:'', 不均等:[], 一回量:null, 補足:[]}; rp.drugs.push(d); }
    return d;
  };

  for(const line of lines){
    if(!line.includes(',') && /^JAHIS/i.test(line.trim())){ rx.version=line.trim(); continue; }
    const f = line.split(',');
    const no = f[0].trim();
    const g = i => (f[i]===undefined ? '' : f[i].trim());
    rx.records.push({no, fields:f.slice(1).map(s=>s.trim()), line});
    switch(no){
      case '1':  rx.hosp={種別:g(1),コード:g(2),都道府県:g(3),名称:g(4)}; break;
      case '2':  rx.hospAddr={郵便番号:g(1),所在地:g(2)}; break;
      case '3':  rx.hospTel={電話:g(1),fax:g(2),他:g(3)}; break;
      case '4':  rx.dept={種別:g(1),コード:g(2),名称:g(3)}; break;
      case '5':  rx.doctor={コード:g(1),カナ:g(2),漢字:g(3)}; break;
      case '11': rx.patient=Object.assign(rx.patient||{},{コード:g(1),氏名:g(2),カナ:g(3)}); break;
      case '12': rx.patient=Object.assign(rx.patient||{},{性別:g(1)}); break;
      case '13': rx.patient=Object.assign(rx.patient||{},{生年月日:g(1)}); break;
      case '21': rx.保険種別=g(1); break;
      case '22': rx.保険者番号=g(1); break;
      case '23': rx.記号番号={記号:g(1),番号:g(2),本人家族:g(3),枝番:g(4)}; break;
      case '51': rx.交付年月日=g(1); break;
      case '52': rx.使用期限=g(1); break;
      case '62': rx.残薬確認=g(1); break;
      case '63': rx.分割指示={回数:g(1),回:g(2)}; break;
      case '64': rx.リフィル={総使用回数:g(1)}; break;
      case '81': (rx.備考=rx.備考||[]).push({連番:g(1),種別:g(2),内容:g(3)}); break;
      case '82': rx.処方箋番号={種別:g(1),番号:g(2)}; break;
      case '101':{ const rp=getRp(g(1)); rp.剤形区分=g(2); rp.剤形名称=g(3); rp.調剤数量=g(4); break; }
      case '102':{ const rp=getRp(g(1)); rp.分割={回ごと:g(2),総:g(3)}; break; }
      case '111':{ const rp=getRp(g(1)); rp.用法={種別:g(2),コード:g(3),名称:g(4),日回数:g(5)}; break; }
      case '181':{ const rp=getRp(g(1)); rp.用法補足.push({連番:g(2),区分:g(3),情報:g(4),用法コード:g(5),部位:g(6)}); break; }
      case '201':{ const d=getDrug(g(1),g(2));
                   d.情報区分=g(3); d.コード種別=g(4); d.コード=g(5); d.名称=g(6);
                   d.用量=g(7); d.力価フラグ=g(8); d.単位=g(9); break; }
      case '211':{ getDrug(g(1),g(2)).単位変換係数=g(3); break; }
      case '221':{ getDrug(g(1),g(2)).不均等=f.slice(3).map(s=>s.trim()).filter(s=>s!==''); break; }
      case '241':{ getDrug(g(1),g(2)).一回量={量:g(3),回数:g(4)}; break; }
      case '281':{ getDrug(g(1),g(2)).補足.push({連番:g(3),区分:g(4),情報:g(5),用法コード:g(6)}); break; }
      default: break;
    }
  }
  if(!rx.version) rx.errors.push('バージョン情報行（JAHISxx）がありません。JAHIS規約の2次元シンボルではない可能性があります。');
  if(rx.rps.length===0) rx.errors.push('処方内容（剤形101/薬品201レコード）が読み取れませんでした。');
  rx.rps.sort((a,b)=>(numOf(a.no)||0)-(numOf(b.no)||0));
  rx.rps.forEach(rp=>rp.drugs.sort((a,b)=>(numOf(a.seq)||0)-(numOf(b.seq)||0)));

  // 突合用のフラット化
  rx.drugs=[];
  rx.rps.forEach(rp=>rp.drugs.forEach(d=>{
    const dose=numOf(d.用量), qty=numOf(rp.調剤数量), conv=numOf(d.単位変換係数);
    d.総量 = (dose!==null&&qty!==null) ? +(dose*qty).toFixed(5) : null;
    d.換算用量 = (dose!==null) ? +(dose*(conv===null?1:conv)).toFixed(5) : null;
    // 名称が省略されている場合、同梱の医薬品コード表から補完する
    if(!d.名称){
      const n=DrugDict.lookup(d.コード種別, d.コード);
      if(n){ d.名称=n; d.名称補完=true; }
    }
    rx.drugs.push(d);
  }));
  return rx;
}

/* ---------- 表示ヘルパ ---------- */
function doseText(d){
  const u=d.単位||'';
  let s=(d.用量||'?')+u;
  if(d.力価フラグ==='2') s+='（力価）';
  return s;
}
function qtyText(rp){
  const n=rp.調剤数量;
  if(n==='') return '';
  const k=rp.剤形区分;
  if(k==='1'||k==='4') return n+'日分';
  if(k==='2') return n+'回分';
  // 外用等は用量に総量を記録し調剤数量1とするのが通常。1のときは表示しない。
  return String(n)==='1' ? '' : '調剤数量'+n;
}
function qtyLabel(rp){
  const k=rp.剤形区分;
  return k==='2' ? '投与回数' : (k==='1'||k==='4') ? '投与日数' : '調剤数量';
}
function useText(rp){
  if(!rp.用法) return '（用法なし）';
  let s=rp.用法.名称||'';
  if(rp.用法.日回数) s+=`（1日${rp.用法.日回数}回）`;
  return s;
}
function suppText(d){
  const a=d.補足.map(s=>(CODE.薬品補足区分[s.区分]?`[${CODE.薬品補足区分[s.区分]}]`:'')+(s.情報||''));
  if(d.不均等.length) a.push('不均等 '+d.不均等.join('-'));
  if(d.一回量) a.push('1回'+d.一回量.量+(d.一回量.回数?`×1日${d.一回量.回数}回`:''));
  return a.filter(Boolean).join(' / ');
}
function rpSuppText(rp){
  return rp.用法補足.map(s=>(CODE.用法補足区分[s.区分]?`[${CODE.用法補足区分[s.区分]}]`:'')+(s.情報||'')).filter(Boolean).join(' / ');
}
function drugCellText(d){
  const q=qtyText(d.rp);
  if(!q) return doseText(d);
  const tot=(d.総量!==null&&d.単位)?` ＝ 計${d.総量}${d.単位}`:'';
  return `${doseText(d)} × ${q}${tot}`;
}

/* ============================================================
   3. 突合エンジン
   ============================================================ */
function keyCode(d){ return (d.コード種別&&d.コード) ? 'C:'+d.コード種別+':'+d.コード : null; }
function keyName(d){ return d.名称 ? 'N:'+norm(d.名称) : null; }
function keyBase(d){ return d.名称 ? 'B:'+baseName(d.名称) : null; }

function runPass(prev, curr, keyFn, label, pairs){
  const b=new Map();
  for(const p of prev){ if(p._m) continue; const k=keyFn(p); if(!k) continue; if(!b.has(k)) b.set(k,[]); b.get(k).push(p); }
  for(const c of curr){
    if(c._m) continue;
    const k=keyFn(c); if(!k) continue;
    const bucket=b.get(k);
    if(bucket&&bucket.length){ const p=bucket.shift(); p._m=c; c._m=p; pairs.push({prev:p,curr:c,match:label}); }
  }
}

function diffPair(p,c,skipSupp){
  const ch=[];
  const unitSame = norm(p.単位)===norm(c.単位);
  if(!numEq(p.用量,c.用量) || !unitSame){
    const equivalent = p.換算用量!==null && c.換算用量!==null && Math.abs(p.換算用量-c.換算用量)<1e-9;
    ch.push({k: equivalent?'用量表記':'用量', a:doseText(p), b:doseText(c), soft:equivalent,
             note: equivalent?'単位変換係数を加味すると実質同量':''});
  }
  if(String(p.rp.調剤数量)!==String(c.rp.調剤数量))
    ch.push({k:qtyLabel(c.rp), a:qtyText(p.rp)||p.rp.調剤数量||'—', b:qtyText(c.rp)||c.rp.調剤数量||'—'});
  if(norm(useText(p.rp))!==norm(useText(c.rp))) ch.push({k:'用法', a:useText(p.rp), b:useText(c.rp)});
  if(p.rp.剤形区分!==c.rp.剤形区分)
    ch.push({k:'剤形', a:CODE.剤形区分[p.rp.剤形区分]||p.rp.剤形区分||'—', b:CODE.剤形区分[c.rp.剤形区分]||c.rp.剤形区分||'—'});
  if(!skipSupp){   // 片側が保存分（自由記述を保存しない）の場合、指示の比較は成立しない
    const ps=suppText(p), cs=suppText(c);
    if(norm(ps)!==norm(cs)) ch.push({k:'薬品への指示', a:ps||'（なし）', b:cs||'（なし）'});
    const pr=rpSuppText(p.rp), cr=rpSuppText(c.rp);
    if(norm(pr)!==norm(cr)) ch.push({k:'剤への指示', a:pr||'（なし）', b:cr||'（なし）'});
  }
  if(p.情報区分!==c.情報区分 && (p.情報区分||c.情報区分))
    ch.push({k:'情報区分', a:CODE.情報区分[p.情報区分]||'—', b:CODE.情報区分[c.情報区分]||'—'});
  return ch;
}

/** 1枚の処方せん単体に対する警告（初回表示でも比較表示でも出す） */
function singleRxAlerts(currRx){
  const alerts=[];
  const seen=new Map();
  for(const d of currRx.drugs){
    const k=keyCode(d)||keyName(d); if(!k) continue;
    if(!seen.has(k)) seen.set(k,[]); seen.get(k).push(d);
  }
  const dups=[...seen.values()].filter(a=>a.length>1);
  if(dups.length)
    alerts.push({level:'warn', text:'処方内に同一薬品の重複があります：'+dups.map(a=>`${a[0].名称}（RP${a.map(d=>d.rp.no).join('・')}）`).join(' ／ ')});
  if(currRx.リフィル) alerts.push({level:'info', text:`リフィル処方箋です（総使用回数 ${currRx.リフィル.総使用回数} 回）。`});
  if(currRx.分割指示) alerts.push({level:'info', text:`分割指示に係る処方箋です（全 ${currRx.分割指示.回数} 回中 ${currRx.分割指示.回} 回目）。`});
  if(currRx.残薬確認) alerts.push({level:'info', text:'残薬確認欄の指示があります：'+(CODE.残薬確認[currRx.残薬確認]||currRx.残薬確認)});
  return alerts;
}

function compare(prevRx, currRx){
  const prev=prevRx.drugs.map(d=>Object.assign(d,{_m:null}));
  const curr=currRx.drugs.map(d=>Object.assign(d,{_m:null}));
  const pairs=[];
  runPass(prev,curr,keyCode,'code',pairs);
  runPass(prev,curr,keyName,'name',pairs);
  runPass(prev,curr,keyBase,'base',pairs);

  const rows=[];
  for(const pr of pairs){
    const ch=diffPair(pr.prev,pr.curr, prevRx.補足除外===true||currRx.補足除外===true);
    const spec = pr.match==='base' && norm(pr.prev.名称)!==norm(pr.curr.名称);
    if(spec) ch.unshift({k:'薬品名', a:pr.prev.名称, b:pr.curr.名称,
                         note:'含量を除いた名称が一致します。規格（含量）が変わっていないか確認してください。'});
    let kind = ch.filter(x=>!x.soft).length ? 'chg' : 'same';
    if(spec) kind='chg';
    rows.push({kind, prev:pr.prev, curr:pr.curr, changes:ch, spec, match:pr.match});
  }
  for(const p of prev) if(!p._m) rows.push({kind:'del', prev:p, curr:null, changes:[]});
  for(const c of curr) if(!c._m) rows.push({kind:'add', prev:null, curr:c, changes:[]});

  const order={del:0,add:1,chg:2,same:3};
  rows.sort((a,b)=>(order[a.kind]-order[b.kind]) || ((numOf((b.curr||b.prev).rp.no)||0)-(numOf((a.curr||a.prev).rp.no)||0))*-1);

  /* --- 警告 --- */
  const alerts=[];
  const pp=prevRx.patient||{}, cp=currRx.patient||{};
  const nameDiff = pp.氏名 && cp.氏名 && norm(pp.氏名)!==norm(cp.氏名);
  const kanaDiff = pp.カナ && cp.カナ && norm(pp.カナ)!==norm(cp.カナ);
  const pb=parseJDate(pp.生年月日), cb=parseJDate(cp.生年月日);
  const birthDiff = pb && cb && pb.key!==cb.key;
  const sexDiff = pp.性別 && cp.性別 && pp.性別!==cp.性別;
  if(nameDiff||birthDiff||sexDiff||kanaDiff){
    const w=[];
    if(nameDiff||kanaDiff) w.push(`氏名 ${pp.氏名||pp.カナ||'—'} → ${cp.氏名||cp.カナ||'—'}`);
    if(birthDiff) w.push(`生年月日 ${pb.text} → ${cb.text}`);
    if(sexDiff) w.push(`性別 ${CODE.性別[pp.性別]||'—'} → ${CODE.性別[cp.性別]||'—'}`);
    alerts.push({level:'danger', text:'患者が一致しません（'+w.join(' ／ ')+'）。読み取った処方せんを確認してください。'});
  }
  const pd=parseJDate(prevRx.交付年月日), cd=parseJDate(currRx.交付年月日);
  if(pd&&cd&&pd.key>cd.key)
    alerts.push({level:'warn', text:`交付日が前後しています（前回 ${pd.text} ＞ 今回 ${cd.text}）。前回・今回が入れ替わっている可能性があります。`});
  if(rows.some(r=>r.spec))
    alerts.push({level:'warn', text:'規格（含量）違いの可能性がある薬品があります。同一銘柄で含量が変わっていないか確認してください。'});

  alerts.push(...singleRxAlerts(currRx));

  const counts={add:0,del:0,chg:0,same:0};
  rows.forEach(r=>counts[r.kind]++);
  return {rows, counts, alerts};
}

/* ============================================================
   3.5 保存（患者ごとに直近1枚だけ）
   ------------------------------------------------------------
   ・氏名や生年月日そのものは保存しない。照合用のハッシュ鍵に変換して持つ。
     端末を紛失しても、保存データから患者を特定しにくくするため。
   ・SHA-256は自前実装。Web Crypto は安全なページ以外で使えないため。
   ・保存先は IndexedDB。使えなければ localStorage、それも無理ならメモリのみ。
   ============================================================ */
const SHA_K=new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,

function sha256hex(str){
  const bytes=new TextEncoder().encode(str);
  const l=bytes.length;
  const buf=new Uint8Array((((l+9)+63)>>6)<<6);
  buf.set(bytes); buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  const bits=l*8;
  dv.setUint32(buf.length-8, Math.floor(bits/4294967296));
  dv.setUint32(buf.length-4, bits>>>0);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  for(let i=0;i<buf.length;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const a1=w[t-15], a2=w[t-2];
      const s0=rotr(a1,7)^rotr(a1,18)^(a1>>>3);
      const s1=rotr(a2,17)^rotr(a2,19)^(a2>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+SHA_K[t]+w[t])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,
       (H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

/** 医療機関の識別子（種別＋都道府県＋機関コード）。種別省略は医科(1)に正規化 */
function hospKey(rx){
  const h=rx.hosp||{};
  if(!h.コード) return '';
  return (h.種別||'1')+':'+(h.都道府県||'')+':'+h.コード;
}
/** 診療科の識別子。コード優先・無ければ名称。レコード自体が無ければ空文字＝
 *  「診療科なし」という1つのキー値として扱う（規約上、診療所・単科病院は
 *  診療科レコードを省略してよいため。機関単位へ黙って合流はさせない） */
function deptKey(rx){
  const d=rx.dept||{};
  if(d.コード) return 'C:'+d.コード;
  if(d.名称) return 'N:'+norm(d.名称);
  return '';
}

/** 照合鍵: 患者（氏名＋生年月日＋性別）× 医療機関 × 診療科。
 *  氏名等は保存せず、この鍵だけを持つ。
 *  カナ・漢字のどちらか一方しか記録しない医療機関があるため、両方から鍵を作って
 *  どれか一致すれば同一とみなす。
 *  医療機関・診療科が違えば別の鍵になる＝別機関の処方せん同士は比較されない。
 *  **医療機関コードが無い場合は鍵を作らない**（第1回監査指摘・修正1。
 *  空の機関キーを許すと、コード欠落の別病院同士が同一キーに合流するため）。 */
function recordKeys(rx, salt){
  const p=rx.patient||{};
  const b=parseJDate(p.生年月日);
  const birth=b?b.key:'';
  const sex=p.性別||'';
  if(!birth) return [];                       // 生年月日がなければ照合しない（人違いを避ける）
  const hk=hospKey(rx);
  if(!hk) return [];                          // 安定した医療機関キーを作れなければ照合しない
  const scope='|H:'+hk+'|D:'+deptKey(rx);
  const keys=[];
  const mk=(tag,name)=>sha256hex(salt+'|'+tag+'|'+norm(name)+'|'+birth+'|'+sex+scope);
  if(p.カナ) keys.push(mk('k',p.カナ));
  if(p.氏名) keys.push(mk('n',p.氏名));
  return keys;
}

/** 候補照合キー: 氏名を含まない「生年月日＋性別＋医療機関＋診療科」。
 *  カナ⇔漢字で氏名キーが一致しない場合の候補提示（修正5）に使う。
 *  自動比較には使わない（同生年月日・同性別の別人が同キーになりうるため）。 */
function candidateKey(rx, salt){
  const p=rx.patient||{};
  const b=parseJDate(p.生年月日);
  const hk=hospKey(rx);
  if(!b || !hk) return '';
  return sha256hex(salt+'|c|'+b.key+'|'+(p.性別||'')+'|H:'+hk+'|D:'+deptKey(rx));
}

/** 保存してよいレコード番号。ここに無いものは保存時に捨てる。
 *  患者を特定しうるレコード（氏名11・性別12・生年月日13・保険21〜31・
 *  麻薬施用患者住所61・電子処方箋の引換番号82）は保存しない。
 *  自由記述レコード（備考81・用法補足181・薬品補足281）も保存しない：
 *  備考等に患者名・住所が書かれる運用があり、患者情報の紛れ込み経路になるため
 *  （第1回監査指摘・修正6）。読取時のその場表示のみで、比較の対象からも外す。
 *  比較に必要な処方内容と、監査に必要な最小限の背景だけを残す。 */
const STORE_KEEP=new Set([
  '1','4','5',                       // 医療機関名・診療科・医師（患者の情報ではない）
  '51','52','62','63','64',          // 交付日・使用期限・残薬確認・分割・リフィル
  '101','102','111',                 // 剤形・調剤数量・用法
  '201','211','221','231','241'      // 薬品・単位変換・不均等・負担区分・1回量
]);

/** 保存用に、患者を特定しうる行を落とす */
function stripForStorage(raw){
  return String(raw).replace(/\x1a[\s\S]*$/,'').split(/\r\n|\r|\n/)
    .filter(line=>{
      if(line.trim()==='') return false;
      if(!line.includes(',') && /^JAHIS/i.test(line.trim())) return true;   // バージョン行
      return STORE_KEEP.has(line.split(',')[0].trim());
    }).join('\r\n')+'\r\n';
}

/* ---------- 比較ロジックの純関数（UI・保存層から独立、テストで固定） ----------
   新旧の規則はここが唯一の定義。画面の役割分担（processScanned）と
   保存の置き換え判定（chooseRecord）の両方がここを参照するため、
   「画面では今回扱いなのに保存は置き換えない」といった食い違いは起きない。 */

/** 交付日の厳格な検証: 実在する暦日のみ比較キー(YYYYMMDD)にする。
 *  表示用の parseJDate は年のみ・年月のみ等も受けるが、新旧判定・保存には
 *  使わない —— 「20269999」のような非実在日付が一度保存されると、以後の
 *  正常な処方が常に「古い」と判定され続けるため（第2回監査指摘3）。 */
function strictDateKey(v){
  v=String(v==null?'':v).trim();
  let y,m,d,era=null;
  if(/^\d{8}$/.test(v)){ y=+v.slice(0,4); m=+v.slice(4,6); d=+v.slice(6,8); }
  else if(/^\d{7}$/.test(v)){                       // 和暦 GYYMMDD
    era=ERA[v[0]]; if(!era) return '';
    const ey=+v.slice(1,3);
    if(ey<1) return '';                             // 元号年00は存在しない
    y=era.b + ey - 1; m=+v.slice(3,5); d=+v.slice(5,7);
  }
  else return '';
  if(y<1926 || y>2100 || m<1 || m>12) return '';
  const leap=(y%4===0 && y%100!==0) || y%400===0;
  const mlen=[31, leap?29:28, 31,30,31,30,31,31,30,31,30,31][m-1];
  if(d<1 || d>mlen) return '';
  const key=String(y).padStart(4,'0')+String(m).padStart(2,'0')+String(d).padStart(2,'0');
  // 和暦は元号の実期間内であることまで確認する（昭和64年1月8日・平成31年5月1日等を弾く）
  if(era && (key<era.from || key>era.to)) return '';
  return key;
}
/** 処方せんの交付日キー。実在日付でなければ ''（＝交付日不明として扱う） */
function issueDateKey(rx){ return strictDateKey(rx.交付年月日); }

/** 読んだ処方せんを「今回」と確定できるか。交付日(YYYYMMDDのキー文字列)で判定。
 *  同日は読んだ方が今回（読取時刻が新しいため）。
 *  **どちらかの日付が不明なら false**＝新旧を判定できない（第1回監査指摘・修正2。
 *  以前は「読んだ方を今回」としており、日付不明のQRが最新の保存を上書きできた）。 */
function scannedIsCurrent(storedDate, scannedDate){
  return !!(storedDate && scannedDate) && scannedDate >= storedDate;
}

/** 保存レコード（無ければnull）と読取交付日から、画面と保存の扱いを決める。
 *  戻り値: {mode:'first', noDate?}
 *        | {mode:'compare', scannedRole:'curr'|'prev', replaceStored:boolean, dateUnknown?}
 *  dateUnknown のとき: 表示上は読んだ方を「今回」の位置に置くが新旧は未確定で、
 *  保存は置き換えない。 */
function decideScan(existing, scannedDate){
  if(!existing) return scannedDate ? {mode:'first'} : {mode:'first', noDate:true};
  if(!scannedDate || !existing.date)
    return {mode:'compare', scannedRole:'curr', replaceStored:false, dateUnknown:true};
  const cur=scannedIsCurrent(existing.date, scannedDate);
  return {mode:'compare', scannedRole:cur?'curr':'prev', replaceStored:cur};
}

/** 保存期限切れ（purge対象）か。savedAt はエポックms。記録が無いものも対象 */
function purgeDue(rec, now, keepDays){
  return !rec.savedAt || rec.savedAt < now - keepDays*86400000;
}

/** 既存の保存分と今読んだ分の、どちらを保存として残すかを決める。
 *  交付日が新しい方を残す（前回処方をあとから読んでも上書きしない）。
 *  交付日が読み取れないものは保存しない・既存を置き換えない（新旧の基準にできないため）。 */
function chooseRecord(existing, incomingDate){
  if(!incomingDate) return 'keep';
  if(!existing) return 'save';
  return scannedIsCurrent(existing.date, incomingDate) ? 'save' : 'keep';
}

const Store=(function(){
  const DBNAME='shohousen_kansa', VER=1, ST='rx';
  const LSKEY='shohousen_kansa_v1';
  let db=null, mode='memory', mem={salt:null, recs:{}};
  let degraded=null;   // housekeeping失敗時に理由が入る。非nullの間は保存・自動比較を止める

  function idbReq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  /** トランザクション完了待ち。abort/errorを必ずrejectする（第2回監査指摘1。
   *  oncompleteだけ待つと、容量超過等でabortしてもPromiseが未解決のまま
   *  「成功したように見える」）。全ての更新系処理はこれを使うこと。 */
  function txDone(tx){
    return new Promise((res,rej)=>{
      // 実行中の書き込み失敗も degraded にする（第3回監査指摘: 起動時のみでは不十分。
      // 失敗を利用者に伝えるだけでは、次回以降の保存・自動比較が続いてしまう）
      const bad=(msg)=>{ degraded=msg; rej(tx.error||new Error(msg)); };
      tx.oncomplete=()=>res();
      tx.onerror =()=>bad('保存領域への書き込みに失敗しました');
      tx.onabort =()=>bad('保存領域への書き込みが中断されました（容量不足の可能性）');
    });
  }

  let initPromise=null;
  function init(){ initPromise=doInit(); return initPromise; }
  /** init完了待ち。initが呼ばれていない・失敗した場合はreject（readyガード） */
  function ready(){
    return initPromise || Promise.reject(new Error('保存領域が未初期化です'));
  }

  async function doInit(){
    try{
      db=await new Promise((res,rej)=>{
        const rq=indexedDB.open(DBNAME,VER);
        rq.onupgradeneeded=()=>{
          const s=rq.result.createObjectStore(ST,{keyPath:'id'});
          s.createIndex('keys','keys',{multiEntry:true});
          rq.result.createObjectStore('meta');
        };
        rq.onsuccess=()=>res(rq.result);
        rq.onerror=()=>rej(rq.error);
        rq.onblocked=()=>rej(new Error('blocked'));
        setTimeout(()=>rej(new Error('timeout')),8000);
      });
      mode='idb';
    }catch(e){
      db=null;
      try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); mode='local'; }
      catch(e2){ mode='memory'; }
      if(mode==='local'){
        try{ mem=JSON.parse(localStorage.getItem(LSKEY))||{salt:null,recs:{}}; }catch(e3){ mem={salt:null,recs:{}}; }
      }
    }
    if(mode==='idb' && navigator.storage && navigator.storage.persist){
      try{ await navigator.storage.persist(); }catch(e){}   // 自動削除されにくくする
    }
    // 整理（移行・90日purge）に失敗したら fail-closed:
    // 「消せていないのに溜め続ける」ことを避けるため、保存・自動比較を止める
    // （読取とその場表示は続けられる）。第1回監査指摘・修正4。
    try{ degraded=null; await housekeeping(); }
    catch(e){ degraded='保存領域の整理（期限切れ削除）に失敗: '+(e&&e.name||e); }
    return mode;
  }

  const SCHEMA=3;        // 3 = 候補照合キー(cand)追加・交付日必須（2026-08-20監査対応）
  const KEEP_DAYS=90;    // 端末に処方情報を残す期間
  async function metaGet(k){
    if(mode==='idb') return await idbReq(db.transaction('meta','readonly').objectStore('meta').get(k));
    return mem['meta_'+k];
  }
  async function metaSet(k,v){
    if(mode==='idb'){
      const tx=db.transaction('meta','readwrite');
      tx.objectStore('meta').put(v,k);
      return txDone(tx);
    }
    const n=cloneMem(); n['meta_'+k]=v; commit(n);
  }
  /** 起動時の整理: 鍵の作り方が変わった旧データの破棄と、90日を過ぎた保存の自動削除。
   *  失敗は握りつぶさず呼び出し元（init）へ投げる（fail-closed）。 */
  async function housekeeping(){
    if(api._test.failHousekeeping) throw new Error('housekeeping test failure');
    if(await metaGet('schema')!==SCHEMA){ await clear(); await metaSet('schema',SCHEMA); }
    const now=Date.now();
    for(const r of await all()) if(purgeDue(r, now, KEEP_DAYS)) await delRec(r.id);
  }

  /** バックアップ取込用の原子的な全置換。検証済みレコードのみ渡すこと。
   *  IndexedDBでは1トランザクションで clear→全put→salt を行い、途中失敗時は
   *  何も反映されない（部分取込をしない。第1回監査指摘・修正3）。 */
  async function replaceAll(recs, salt){
    if(mode==='idb'){
      const tx=db.transaction([ST,'meta'],'readwrite');
      tx.objectStore(ST).clear();
      for(const r of recs) tx.objectStore(ST).put(r);
      if(salt) tx.objectStore('meta').put(salt,'salt');
      return txDone(tx);
    }
    const n=cloneMem(); n.recs={};
    for(const r of recs) n.recs[r.id]=r;
    if(salt) n.salt=salt;
    commit(n);
  }
  /** localStorage系の更新は copy-on-write。next（変更後の状態）を先に永続化し、
   *  成功したときだけ mem を差し替える。失敗したら mem は変更せず degraded にする。
   *  （第3回監査指摘1: 先に mem を書き換えてから flush すると、保存に失敗しても
   *   メモリ上は成功扱いになり、未保存レコードが次回比較に使われる） */
  function commit(next){
    if(mode!=='local'){ mem=next; return; }
    try{ localStorage.setItem(LSKEY, JSON.stringify(next)); }
    catch(e){
      degraded='保存領域への書き込みに失敗しました（容量不足の可能性）';
      throw new Error('localStorageへの書き込みに失敗しました（容量不足の可能性）');
    }
    mem=next;
  }
  /** memの浅いコピー（recs/meta_* を持つ素のオブジェクト） */
  function cloneMem(){ return Object.assign({}, mem, {recs:Object.assign({}, mem.recs)}); }

  async function getSalt(){
    if(mode==='idb'){
      const tx=db.transaction('meta','readwrite');
      let s=await idbReq(tx.objectStore('meta').get('salt'));
      if(!s){ s=randomSalt(); tx.objectStore('meta').put(s,'salt'); }
      await txDone(tx);
      return s;
    }
    if(!mem.salt){ const n=cloneMem(); n.salt=randomSalt(); commit(n); }
    return mem.salt;
  }
  // 書き出したデータを別端末で読み込む場合、鍵の作り方を揃えるため塩も引き継ぐ
  async function setSalt(s){
    if(!s) return;
    if(mode==='idb'){
      const tx=db.transaction('meta','readwrite');
      tx.objectStore('meta').put(s,'salt');
      return txDone(tx);
    }
    const n=cloneMem(); n.salt=s; commit(n);
  }
  function randomSalt(){
    const a=new Uint8Array(16);
    (crypto&&crypto.getRandomValues) ? crypto.getRandomValues(a)
      : a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
    return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function findByKeys(keys){
    if(!keys.length) return null;
    if(mode==='idb'){
      const idx=db.transaction(ST,'readonly').objectStore(ST).index('keys');
      for(const k of keys){ const r=await idbReq(idx.get(k)); if(r) return r; }
      return null;
    }
    for(const k of keys) for(const id in mem.recs) if((mem.recs[id].keys||[]).includes(k)) return mem.recs[id];
    return null;
  }
  async function putRec(rec){
    if(mode==='idb'){
      const tx=db.transaction(ST,'readwrite');
      tx.objectStore(ST).put(rec);
      return txDone(tx);
    }
    const n=cloneMem(); n.recs[rec.id]=rec; commit(n);
  }
  async function delRec(id){
    if(mode==='idb'){
      const tx=db.transaction(ST,'readwrite');
      tx.objectStore(ST).delete(id);
      return txDone(tx);
    }
    const n=cloneMem(); delete n.recs[id]; commit(n);
  }
  async function all(){
    if(mode==='idb') return await idbReq(db.transaction(ST,'readonly').objectStore(ST).getAll());
    return Object.values(mem.recs);
  }
  async function clear(){
    if(mode==='idb'){
      const tx=db.transaction(ST,'readwrite');
      tx.objectStore(ST).clear();
      return txDone(tx);
    }
    const n=cloneMem(); n.recs={}; commit(n);
  }
  const api={init, ready, getSalt, setSalt, findByKeys, putRec, delRec, all, clear, replaceAll,
          get mode(){ return mode; },
          get degraded(){ return degraded; },
          KEEP_DAYS,
          _test:{failHousekeeping:false}};   // 回帰テスト用フック（本番コードからは常にfalse）
  return api;
})();

/** 今読んだ処方を保存する（交付日が新しい方を残す。交付日不明は保存しない）。
 *  existing がある場合、照合キー（keys/cand）は常に統合して保持する
 *  —— カナ⇔漢字の手動確認後の統合（修正5）もこの経路で永続化される。 */
async function saveCurrent(rx, keys, existing, cand){
  if(!keys.length) return {saved:false, reason:'照合キーを作れないため保存できません。'};
  const date=issueDateKey(rx);
  const merged=[...new Set([...keys, ...(existing?existing.keys||[]:[])])];
  const mergedCand=(existing&&existing.cand)||cand||'';
  if(chooseRecord(existing, date)==='keep'){
    if(!existing) return {saved:false, reason:'交付日が読み取れないため保存しません（次回の新旧判定の基準にできないため）。'};
    await Store.putRec(Object.assign({}, existing, {keys:merged, cand:mergedCand}));
    return {saved:false, reason: date
      ? '保存済みの処方の方が新しいため、保存は更新しませんでした。'
      : '交付日が読み取れないため、保存は更新しませんでした（保存分は維持）。'};
  }
  await Store.putRec({id: existing?existing.id:keys[0], keys:merged, cand:mergedCand, date,
                      savedAt:Date.now(), text:stripForStorage(rx.raw)});
  return {saved:true, replaced:!!existing};
}

  const d=rx.dept||{};
  const dept=d.名称||(d.コード?('診療科コード'+d.コード):'');

function paneSummary(rx){
  if(!rx) return '';
  const p=rx.patient||{}, b=parseJDate(p.生年月日), d=parseJDate(rx.交付年月日);
  const hasPatient = !!(p.氏名||p.カナ||p.生年月日);

function remarksBlock(rx){

/* ============================================================
   5. 読取（分割QR / Shift-JIS）
   ============================================================ */
const sjis = new TextDecoder('shift_jis', {fatal:false});
const sessions = {scan:newSession()};
function newSession(){ return {parts:new Map(), total:null, parity:null, lastIdx:null}; }

function renderSlots(t){
  const s=sessions[t];
  let html='';
  if(s.total){
    // 番号は処方せんに印字されている順（通常は左から）に対応する
    const next=(()=>{ for(let i=0;i<s.total;i++) if(!s.parts.has(i)) return i; return -1; })();
    html='<span class="slots-label">QR</span>'+
      Array.from({length:s.total},(_,i)=>
        `<span class="slot ${s.parts.has(i)?'on':(i===next?'next':'')}">${s.parts.has(i)?(i+1)+'✓':(i+1)}</span>`
      ).join('');
  }
  const el=document.getElementById('slots-'+t); if(el) el.innerHTML=html;
  if(cam.target===t) document.getElementById('slots-cam').innerHTML=html;
}
/** 未読の番号を「2番目・3番目」の形で返す */
function missingText(s){
  const miss=[];
  for(let i=0;i<s.total;i++) if(!s.parts.has(i)) miss.push((i+1)+'番目');
  return miss.join('・');
}
function msg(t, text, cls){
  const el=document.getElementById('msg-'+t); if(!el) return;
  el.className='msg show '+(cls||'ok'); el.textContent=text;
  if(cam.target===t){ const m=document.getElementById('msg-cam'); m.className='msg show '+(cls||'ok'); m.textContent=text; }
}
function clearMsg(t){
  const el=document.getElementById('msg-'+t); if(el) el.className='msg';
  const m=document.getElementById('msg-cam'); if(m) m.className='msg';
}

/** jsQR の結果を1シンボル分取り込む。戻り値: 'done' | 'partial' | 'dup' | 'mismatch' */
function feedSymbol(code, t){
  const sa=(code.chunks||[]).find(c=>c.type==='structuredappend');
  const bytes=code.binaryData||[];
  const s=sessions[t];
  if(!sa){
    finalize(t, bytes);
    return 'done';
  }
  const idx=sa.currentSequence, total=sa.totalSequence+1, parity=sa.parity;
  if(s.parity!==null && s.parity!==parity && s.parts.size>0) return 'mismatch';
  s.lastIdx=idx;
  if(s.parts.has(idx)) return 'dup';
  s.parity=parity; s.total=total; s.parts.set(idx, bytes);
  renderSlots(t);
  if(s.parts.size<total) return 'partial';
  const all=[];
  for(let i=0;i<total;i++) all.push(...s.parts.get(i));
  let x=0; for(const b of all) x^=b;
  finalize(t, all, x!==parity);
  return 'done';
}

function finalize(t, bytes, parityBad){
  const text=sjis.decode(new Uint8Array(bytes));
  const rx=parseJahis(text);
  sessions.scan=newSession(); renderSlots('scan');   // 次の処方せんの読取に備えてリセット
  if(rx.errors.length){
    state.prev=null; state.curr=rx; compareMeta={mode:'first', noSave:true};
    renderResult();
    msg('scan', rx.errors.join(' '), 'err');
    beep('err');
    return;
  }
  if(parityBad) msg('scan','読み取りました。ただし分割QRのパリティが一致しません。データが混在していないか生データを確認してください。','warn');
  beep('ok');
  processScanned(rx);
}

/* 読み取った処方せんの処理:
   同一キー（患者×医療機関×診療科）の保存分を探し、
   無ければ「初回」として保存、有れば交付日で新旧を判定して比較する。
   氏名キー不一致でも生年月日+性別+機関+診療科が一致する保存分があれば、
   自動比較はせず候補として提示する（修正5）。 */
let pendingScan=null;   // 候補確認待ち: {rx, keys, cand, candidates:[rec]}
async function processScanned(rx){
  pendingScan=null;
  let keys=[], cand='', found=null, candidates=[], storeOK=true;
  try{
    await Store.ready();                       // 初期化完了前は保存・自動比較を許可しない
    if(Store.degraded) throw new Error(Store.degraded);
    const salt=await Store.getSalt();
    keys=recordKeys(rx, salt);
    cand=candidateKey(rx, salt);
    if(keys.length){
      found=await Store.findByKeys(keys);
      if(!found && cand)
        candidates=(await Store.all()).filter(r=>r.cand===cand);
    }
  }catch(e){ storeOK=false; }

  const scannedDate=issueDateKey(rx);

  /* 保存・比較の対象外（fail-closed含む）の理由を特定して表示 */
  if(!storeOK || !keys.length){
    state.prev=null; state.curr=rx;
    compareMeta={mode:'first', noSave:true};
    renderResult();
    if(!storeOK && Store.degraded)
      msg('scan','保存領域の整理に失敗しているため、保存・自動比較を停止しています（読取と表示のみ）。端末の空き容量を確認し、開き直してください。','err');
    else if(!storeOK)
      msg('scan','保存領域を読めないため、保存と自動比較ができません（内容表示のみ）。','err');
    else if(!parseJDate((rx.patient||{}).生年月日))
      msg('scan','患者氏名または生年月日が記録されていないため、保存・比較はできません（内容表示のみ）。','warn');
    else
      msg('scan','医療機関コードが読み取れないため、履歴保存・自動比較の対象外です（内容表示のみ）。','warn');
    renderStoreInfo();
    return;
  }

  /* 氏名表記違いの候補がある場合は自動判定せず提示（修正5） */
  if(!found && candidates.length){
    pendingScan={rx, keys, cand, candidates};
    state.prev=null; state.curr=rx;
    compareMeta={mode:'candidates'};
    renderResult();
    msg('scan','氏名の表記が異なる保存分が見つかりました。同一患者か確認してください。','warn');
    renderStoreInfo();
    return;
  }

  // 保存済みとまったく同じ処方せん（同じ紙をもう一度読んだ）は取り込まない。
  // 取り込むと自分自身と比較して「全て継続」になり、意味のない結果が出るため。
  // 判定は保存形式に揃えた内容の完全一致で行う（同一キー・同一交付日でも
  // 内容が違えば別の処方せん＝訂正・差し替えの可能性があるので通常どおり処理する）。
  if(found && stripForStorage(rx.raw)===found.text){
    state.prev=null; state.curr=rx;
    compareMeta={mode:'already'};
    renderResult();
    msg('scan','この処方せんはすでに登録済みです。取り込みませんでした。','warn');
    beep('dup');
    renderStoreInfo();
    return;
  }

  const d=decideScan(found, scannedDate);   // 新旧・初回の判定はこの純関数が唯一の定義

  if(d.mode==='first'){
    state.prev=null; state.curr=rx;
    compareMeta={mode:'first', noSave:!!d.noDate};
    renderResult();
    if(d.noDate){
      msg('scan','交付日が読み取れないため保存しません（次回の新旧判定の基準にできないため）。内容表示のみ行います。','warn');
    }else{
      try{ await saveCurrent(rx, keys, null, cand); msg('scan','初回として保存しました。次回の読取から自動で比較されます。','ok'); }
      catch(e){ msg('scan','保存できませんでした（'+(e.name||e)+'）。','err'); }
    }
  }else{
    await showComparison(rx, keys, cand, found, d);
  }
  renderStoreInfo();
}

/** 保存分との比較表示＋保存更新（通常経路・候補確認後の経路の共通部） */
async function showComparison(rx, keys, cand, rec, d){
  const stored=parseJahis(rec.text);
  stored.補足除外=true;   // 保存分は自由記述（備考・補足）を持たないため、指示の比較は行わない
  if(d.scannedRole==='curr'){ state.prev=stored; state.curr=rx; compareMeta={mode:'compare', storedSide:'prev', dateUnknown:!!d.dateUnknown}; }
  else                      { state.prev=rx; state.curr=stored; compareMeta={mode:'compare', storedSide:'curr', dateUnknown:!!d.dateUnknown}; }
  renderResult();
  try{
    await saveCurrent(rx, keys, rec, cand);   // 置き換え判定も同じ純関数系（chooseRecord→scannedIsCurrent）
    msg('scan', d.dateUnknown
      ? '交付日が読み取れないため新旧を判定できません。保存分は維持しました。'
      : d.replaceStored
      ? '前回処方と比較しました。今回分を保存しました。'
      : '読み取った処方せんは保存分より古いため、「前回」側として比較しました（保存は最新のまま）。', d.dateUnknown?'warn':'ok');
  }catch(e){
    msg('scan','比較は表示しましたが、保存を更新できませんでした（'+(e.name||e)+'）。','err');
  }
}

/** 候補確認: 同一患者として選択（修正5）。キーを統合し、以後は自動照合される */
async function confirmCandidate(recId){
  if(!pendingScan) return;
  const {rx, keys, cand, candidates}=pendingScan;
  const rec=candidates.find(r=>r.id===recId);
  if(!rec) return;
  pendingScan=null;
  const scannedDate=issueDateKey(rx);
  await showComparison(rx, keys, cand, rec, decideScan(rec, scannedDate));
  renderStoreInfo();
}
/** 候補確認: 別人として初回扱いで保存 */
async function rejectCandidates(){
  if(!pendingScan) return;
  const {rx, keys, cand}=pendingScan;
  pendingScan=null;
  const scannedDate=issueDateKey(rx);
  state.prev=null; state.curr=rx;
  compareMeta={mode:'first', noSave:!scannedDate};
  renderResult();
  if(!scannedDate){
    msg('scan','別人として扱います。交付日が読み取れないため保存はしません。','warn');
  }else{
    try{ await saveCurrent(rx, keys, null, cand); msg('scan','別人として初回保存しました。','ok'); }
    catch(e){ msg('scan','保存できませんでした（'+(e.name||e)+'）。','err'); }
  }
  renderStoreInfo();
}

/* ---------- バックアップ取込の検証（第1回監査指摘・修正3） ----------
   取込は保存最小化の迂回路になるため、全件を検証し text を改めて
   stripForStorage に通してから原子的に置換する。1件でも不正なら全体を拒否。 */
const HEX64=/^[0-9a-f]{64}$/, HEX32=/^[0-9a-f]{32}$/;
function validateBackup(data, now){
  now = now===undefined ? Date.now() : now;
  if(!data || data.format!=='shohousen-kansa/1') return {ok:false, error:'書き出しデータの形式ではありません'};
  if(typeof data.salt!=='string' || !HEX32.test(data.salt)) return {ok:false, error:'塩(salt)が不正です'};
  if(!Array.isArray(data.records)) return {ok:false, error:'records がありません'};
  if(data.records.length>100000) return {ok:false, error:'件数が多すぎます'};
  const ids=new Set(), allKeys=new Set(), out=[];
  let skippedExpired=0;
  for(let i=0;i<data.records.length;i++){
    const r=data.records[i], at=(i+1)+'件目';
    if(!r || typeof r!=='object') return {ok:false, error:at+': レコードが不正です'};
    // id は照合キー由来の64桁16進のみ（任意文字列を許すと表示層への注入原資になる。第2回監査指摘2）
    if(typeof r.id!=='string' || !HEX64.test(r.id) || ids.has(r.id))
      return {ok:false, error:at+': id が不正または重複しています'};
    ids.add(r.id);
    if(!Array.isArray(r.keys) || !r.keys.length || r.keys.length>8 ||
       !r.keys.every(k=>typeof k==='string'&&HEX64.test(k)))
      return {ok:false, error:at+': 照合キーが不正です'};
    for(const k of r.keys){
      if(allKeys.has(k)) return {ok:false, error:at+': 照合キーが他のレコードと重複しています（誤比較の原因になるため拒否）'};
      allKeys.add(k);
    }
    if(typeof r.date!=='string' || strictDateKey(r.date)!==r.date)
      return {ok:false, error:at+': 交付日が実在する日付ではありません'};
    if(typeof r.savedAt!=='number' || !isFinite(r.savedAt) || r.savedAt<=0)
      return {ok:false, error:at+': 保存日時が不正です'};
    if(r.savedAt > now + 60000)
      return {ok:false, error:at+': 保存日時が未来です（purgeを無期限に回避できるため拒否）'};
    if(r.cand!==undefined && !(typeof r.cand==='string' && (r.cand===''||HEX64.test(r.cand))))
      return {ok:false, error:at+': 候補キーが不正です'};
    if(typeof r.text!=='string' || !r.text)
      return {ok:false, error:at+': 処方データがありません'};
    // 許可レコードのみに再strip（迂回で氏名等が紛れていても、ここで確実に落ちる）
    const stripped=stripForStorage(r.text);
    // text と メタデータの整合: strip後もJAHISとして解析でき、交付日が一致すること
    const parsed=parseJahis(stripped);
    if(parsed.errors.length || issueDateKey(parsed)!==r.date)
      return {ok:false, error:at+': 処方データと交付日が一致しません'};
    // 保存期限切れは取り込まない（次回起動でpurgeされるだけのデータを持ち込まない）
    if(purgeDue(r, now, Store.KEEP_DAYS)){ skippedExpired++; continue; }
    out.push({id:r.id, keys:[...r.keys], cand:r.cand||'', date:r.date, savedAt:r.savedAt,
              text:stripped});
  }
  return {ok:true, records:out, salt:data.salt, skippedExpired};
}

/* ============================================================
   読取音
   ------------------------------------------------------------
   iOS Safari では WebAudio(AudioContext) がカメラ使用中に無音になることがある
   （音量・マナーモードに関係なく鳴らない）。そのため
   「WAVを生成して <audio> で鳴らす」方式を主、WebAudio を予備とする。
   iOS の自動再生制限は<audio>要素ごとに掛かるので、要素は1つだけ使い回し、
   最初のタップで無音WAVを再生して解除しておく。
   ============================================================ */
const Sound=(function(){
  const RATE=22050;
  // 種別ごとの音（[周波数Hz, 長さ秒]。周波数0は無音＝間）
  const SPEC={
    part:[[660,0.13]],                        // QRを1つ読んだ
    ok:  [[880,0.13],[0,0.04],[1320,0.20]],   // 全部読み終わった
    dup: [[330,0.13]],                        // 読取済み
    err: [[220,0.38]],                        // エラー
  };
  let el=null, urls=null, unlocked=false, ctx=null;

  function encodeWav(sm){
    const n=sm.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,RATE,true); v.setUint32(28,RATE*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,'data'); v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++) v.setInt16(44+i*2, Math.max(-1,Math.min(1,sm[i]))*32767, true);
    const b=new Uint8Array(buf); let s='';
    for(let i=0;i<b.length;i+=4096) s+=String.fromCharCode.apply(null, b.subarray(i,i+4096));
    return 'data:audio/wav;base64,'+btoa(s);
  }
  function render(segs){
    let total=0; for(const g of segs) total+=Math.round(g[1]*RATE);
    const out=new Float32Array(total);
    let p=0;
    for(const [f,dur] of segs){
      const n=Math.round(dur*RATE);
      for(let i=0;i<n;i++){
        // 立ち上がり5ms・立ち下がり25msで包絡（プツッというクリック音を防ぐ）
        const env=Math.min(1, i/(0.005*RATE), (n-i)/(0.025*RATE));
        out[p+i]= f ? Math.sin(2*Math.PI*f*(i/RATE))*0.7*env : 0;
      }
      p+=n;
    }
    return out;
  }
  function build(){
    if(urls) return;
    urls={};
    try{
      for(const k in SPEC) urls[k]=encodeWav(render(SPEC[k]));
      urls._silent=encodeWav(new Float32Array(Math.round(0.05*RATE)));
      el=new Audio(); el.preload='auto';
    }catch(e){ urls=null; }
  }
  /** 最初のタップで呼ぶ。iOSの再生制限を解除する */
  function unlock(){
    build();
    if(!unlocked && el){
      unlocked=true;
      try{
        el.src=urls._silent;
        const p=el.play();
        if(p&&p.catch) p.catch(()=>{});
      }catch(e){}
    }
    try{   // 予備のWebAudioも同じタップの中で起こしておく
      const C=window.AudioContext||window.webkitAudioContext;
      if(C){
        if(!ctx) ctx=new C();
        if(ctx.state!=='running') ctx.resume().catch(()=>{});
        const b=ctx.createBuffer(1,1,ctx.sampleRate), s=ctx.createBufferSource();
        s.buffer=b; s.connect(ctx.destination); s.start(0);
      }
    }catch(e){}
  }
  function webAudioFallback(kind){
    if(!ctx) return;
    const go=()=>{
      let t=ctx.currentTime+0.02;
      for(const [f,dur] of SPEC[kind]||SPEC.part){
        if(f){
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.frequency.value=f;
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(0.35, t+0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t+dur);
        }
        t+=dur;
      }
    };
    try{ ctx.state==='running' ? go() : ctx.resume().then(go).catch(()=>{}); }catch(e){}
  }
  function play(kind){
    build();
    if(!el || !urls || !urls[kind]){ webAudioFallback(kind); return; }
    try{
      el.src=urls[kind];
      el.currentTime=0;
      const p=el.play();
      if(p&&p.catch) p.catch(()=>webAudioFallback(kind));
    }catch(e){ webAudioFallback(kind); }
  }
  return {unlock, play, _spec:SPEC};
})();
// タップ・クリックのたびに解除を試みる（iOSはユーザー操作の中でしか解除できない）
['pointerdown','touchend','click'].forEach(ev=>
  document.addEventListener(ev, ()=>Sound.unlock(), true));
/** 画面フラッシュ。カメラダイアログが開いている間はその中に出す
 *  （<dialog> は最前面レイヤーに描画されるため、外に置くと隠れる）。 */
function flash(kind){
  const host=document.getElementById('camDlg').open
    ? document.querySelector('#camDlg .dlg') : document.body;
  let el=host.querySelector(':scope > .flash');
  if(!el){ el=document.createElement('div'); el.className='flash'; host.appendChild(el); }
  el.className='flash '+kind;          // 一度リセットしてアニメーションを再始動
  void el.offsetWidth;
  el.classList.add('go');
}

/** 読取フィードバック（音＋画面フラッシュ＋振動）
 *  kind: 'part'=1個読取, 'ok'=全部読取完了, 'dup'=読取済み, 'err'=エラー
 *  音はマナーモードで鳴らない。フラッシュは常に見える。
 *  振動は Android のみ（iOS Safari は振動APIに非対応）。 */
function beep(kind){
  // 'dup'（読取済みのQRをもう一度読んだ）は画面を光らせない。
  // 分割QRを順にかざす間、同じQRが何度も検出されて点滅し続けるため。
  // 進んでいないことは音（低音）と画面の番号表示で分かる。
  if(kind!=='dup') flash(kind);
  try{
    if(navigator.vibrate)
      navigator.vibrate(kind==='part'?40 : kind==='ok'?[40,60,120] : kind==='dup'?20 : 250);
  }catch(e){}
  Sound.play(kind);
}

/* ---------- カメラ ---------- */
const cam={target:null, stream:null, raf:0, track:null, done:false};
async function openCamera(t){
  Sound.unlock();            // カメラを開くタップの中で音の再生制限を解除する
  cam.target=t; cam.done=false; clearMsg(t);
  document.getElementById('camTitle').textContent='処方せんを読む — カメラで読取';
  document.getElementById('camDlg').showModal();
  renderSlots(t);
  const st=document.getElementById('scanState');
  const localHost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const insecure = location.protocol!=='https:' && !localHost;
  const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
  const FILE_HINT = location.protocol==='file:'
    ? 'HTMLファイルを直接開いた状態（file://）では、ブラウザの制約でカメラを使えません。同じフォルダの「カメラで使う.bat」から起動し直すとカメラが使えます。'
    : insecure
    ? 'このアドレス（http://…）ではブラウザがカメラの使用を許可しません。かわりに［画像から読取］を押すと、その場で撮影して読み取れます。'
    : inFrame
    ? 'この画面は埋め込み表示のため、ライブカメラを使えません。［撮影して読取］を押すと、その場で撮影して読み取れます。'
    : 'ブラウザのカメラ権限を許可してください。';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    st.textContent=FILE_HINT+'（「画像から読取」はこのままでも使えます）';
    return;
  }
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
  }catch(e){
    st.textContent='カメラを起動できませんでした（'+(e.name||e)+'）。'+FILE_HINT;
    return;
  }
  const v=document.getElementById('video');
  v.srcObject=cam.stream; await v.play().catch(()=>{});
  cam.track=cam.stream.getVideoTracks()[0];
  st.textContent='QRコードを枠に合わせてください';
  tick();
}
function tick(){
  const v=document.getElementById('video');
  if(!cam.stream){ return; }
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
    cv.width=v.videoWidth; cv.height=v.videoHeight;
    ctx.drawImage(v,0,0,cv.width,cv.height);
    const img=ctx.getImageData(0,0,cv.width,cv.height);
    let code=null;
    try{ code=jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'}); }catch(e){ code=null; }
    if(code) handleScan(code);
  }
  cam.raf=requestAnimationFrame(tick);
}
function handleScan(code){
  if(cam.done) return;            // 完了後は読み取らない（閉じるまでの間に再検出して光らせない）
  const t=cam.target, st=document.getElementById('scanState');
  const r=feedSymbol(code, t);
  const s=sessions[t];
  if(r==='mismatch'){ st.textContent='別の処方せんのQRです。読み取りません。'; beep('err'); return; }
  if(r==='dup'){ st.textContent=`${s.lastIdx+1}番目は読取済み — 残り: ${missingText(s)}`; return; }
  if(r==='partial'){ st.textContent=`${s.lastIdx+1}番目を読取（${s.parts.size}/${s.total}）— 残り: ${missingText(s)}`; beep('part'); return; }
  cam.done=true;                  // 完了。以降のフレームは無視する
  st.textContent='読み取り完了';
  setTimeout(closeCamera, 800);   // 完了音とフラッシュを見せてから閉じる
}
function closeCamera(){
  if(cam.raf) cancelAnimationFrame(cam.raf); cam.raf=0;
  if(cam.stream){ cam.stream.getTracks().forEach(x=>x.stop()); cam.stream=null; }
  cam.track=null;
  document.getElementById('camDlg').close();
  cam.target=null;
}
document.getElementById('camDlg').addEventListener('close', ()=>{
  if(cam.raf) cancelAnimationFrame(cam.raf); cam.raf=0;
  if(cam.stream){ cam.stream.getTracks().forEach(x=>x.stop()); cam.stream=null; }
  // 読み取り途中で閉じた場合は、集めた分割QRを破棄する。
  // 残しておくと、次に別の処方せんを読んだときに前の断片と混ざるため。
  if(!cam.done && sessions.scan.parts.size>0){
    sessions.scan=newSession();
    renderSlots('scan');
    msg('scan','読み取りを中止しました。分割QRの読取状況はリセットされました。','warn');
  }
  cam.target=null;
});

/* ---------- 画像から読取（ファイル選択 / ドロップ / 貼り付け） ---------- */
function pickImage(){ Sound.unlock(); document.getElementById('filepick').click(); }
document.getElementById('filepick').addEventListener('change', e=>{
  const f=e.target.files[0]; if(f) readImage(f, 'scan'); e.target.value='';
});
function readImage(file, t){
  clearMsg(t);
  msg(t,'画像を解析しています…','warn');
  const url=URL.createObjectURL(file), im=new Image();
  im.onerror=()=>{ URL.revokeObjectURL(url); msg(t,'画像を読み込めませんでした。','err'); };
  im.onload=()=>{
    URL.revokeObjectURL(url);
    const long=Math.max(im.naturalWidth, im.naturalHeight)|0;
    if(long<200){ msg(t,'画像が小さすぎます。','err'); return; }
    // スマホ写真は数千pxあるため、長辺を段階的に変えて試す（小さすぎるとQRが潰れ、大きすぎると遅い）
    const sizes=[...new Set([1600,2400,3200,long].map(s=>Math.min(s,long)))];
    let i=0;
    const step=()=>{
      if(i>=sizes.length){
        msg(t,'画像からQRコードを検出できませんでした。QRコードが画面いっぱいに写るように、明るい場所で正面から撮り直してください。','err');
        return;
      }
      const sc=sizes[i++]/long;
      const w=Math.round(im.naturalWidth*sc), h=Math.round(im.naturalHeight*sc);
      const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
      cv.width=w; cv.height=h; ctx.drawImage(im,0,0,w,h);
      let code=null;
      try{ code=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'}); }catch(e){}
      if(!code){ setTimeout(step,0); return; }   // 描画を止めないよう1解像度ずつ試す
      const r=feedSymbol(code,t), s=sessions[t];
      if(r==='mismatch'){ msg(t,'別の処方せんのQRです。読み取りませんでした。','err'); beep('err'); }
      else if(r==='dup'){ msg(t,`${s.lastIdx+1}番目は読取済みです。残り ${missingText(s)} を撮影してください。`,'warn'); beep('dup'); }
      else if(r==='partial'){ msg(t,`${s.lastIdx+1}番目を読取（${s.parts.size}/${s.total}）。残り ${missingText(s)} を撮影してください。`,'warn'); beep('part'); }
      // 完了時のメッセージと音は finalize() が出す
    };
    setTimeout(step,0);
  };
  im.src=url;
}

  document.getElementById('txtMsg').textContent='';

}
function applyText(){
  const v=document.getElementById('txtArea').value;
  if(!v.trim()){ document.getElementById('txtMsg').textContent='テキストが空です。'; return; }
  const rx=parseJahis(v);
  document.getElementById('txtDlg').close();
  if(rx.errors.length){
    state.prev=null; state.curr=rx; compareMeta={mode:'first', noSave:true};
    renderResult();
    msg('scan', rx.errors.join(' '), 'err');
    return;
  }
  processScanned(rx);
}

document.getElementById('result').addEventListener('click', e=>{
  const t=e.target && e.target.closest ? e.target.closest('button[data-cand-idx],button[data-cand-reject]') : null;
  if(!t || !pendingScan) return;
  if(t.hasAttribute('data-cand-reject')){ rejectCandidates(); return; }

  if(rec) confirmCandidate(rec.id);
});

// 端末・開き方に応じて、使える読取方法を案内する
// （ライブカメラは https か localhost でしか使えない。スマホはファイル選択から
//   OS標準のカメラを直接起動できるため、その制約を受けない）
(function(){
  const mq = matchMedia('(pointer:coarse)');
  const localHost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
  // ライブカメラは https か localhost、かつ埋め込み表示でない場合のみ
  const camLive = (location.protocol==='https:' || localHost) && !inFrame;
  let noteEl = null;

  function apply(){
    const touch = mq.matches;
    document.querySelectorAll('.drop').forEach(d=>{
      d.textContent = touch
        ? '［撮影して読取］を押すと、その場でQRコードを撮影して読み取れます'
        : '画像ファイルをここにドロップ／このカードを選んで Ctrl+V で貼り付け';
    });
    document.querySelectorAll('.pane .btnrow').forEach(row=>{
      const shoot=row.querySelector('button[onclick^="pickImage"]');
      const live =row.querySelector('button[onclick^="openCamera"]');
      if(shoot){
        shoot.textContent = touch ? '撮影して読取' : '画像から読取';
        shoot.classList.toggle('primary', !camLive);
      }
      if(live){
        live.classList.toggle('primary', camLive);
        live.classList.toggle('hidden', !camLive && touch);   // 使えない環境では出さない
      }
    });

    let note='';
    if(location.protocol==='file:')
      note='ファイルを直接開いているため、カメラは使えません（ブラウザのセキュリティ制約）。カメラを使うときは、同じフォルダの「カメラで使う.bat」から起動してください。画像ファイル・テキストからの読取はこのままご利用いただけます。';
    else if(!camLive && touch)
      note='この開き方ではライブカメラを使えないため、［撮影して読取］をお使いください。押すとカメラが起動し、撮った写真をその場で読み取ります。分割QRの処方せんは、QRごとに撮影を繰り返してください。';
    else if(!camLive)
      note='この開き方ではライブカメラを使えません。［画像から読取］で、撮影済みの画像から読み取れます。';

    if(note){
      if(!noteEl){
        noteEl=document.createElement('div');
        noteEl.className='alert warn noprint';
        document.querySelector('.panes').insertAdjacentElement('beforebegin', noteEl);
      }
      noteEl.textContent=note;
    }else if(noteEl){ noteEl.remove(); noteEl=null; }
  }
  apply();
  if(mq.addEventListener) mq.addEventListener('change', apply);
})();
</script>
